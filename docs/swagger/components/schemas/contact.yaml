type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    type: string
    example: 60d21b4667d0d8992e610c85
  name:
    type: string
    example: John Doe
  phoneNumber:
    type: string
    example: '+1234567890'
  email:
    type: string
    example: john@example.com
  isFavourite:
    type: boolean
    example: true
  contactType:
    type: string
    enum: [work, home, personal]
    example: work
  userId:
    type: string
    example: '686a8b84bd0ae6dc6e2cc30b'
  photo:
    type:
      - string
      - 'null'
    example: https://res.cloudinary.com/demo/image/upload/sample.jpg
  createdAt:
    type: string
    format: date-time
    example: '2025-07-16T16:04:11.390Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-07-16T16:04:11.390Z'
