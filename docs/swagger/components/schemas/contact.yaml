type: object
required:
  - _id
  - name
  - email
  - phoneNumber
  - contactType
properties:
  _id:
    type: string
    example: 60d21b4667d0d8992e610c85
  name:
    type: string
    example: John Doe
  email:
    type: string
    format: email
    example: john@example.com
  phoneNumber:
    type: string
    example: '+1234567890'
  contactType:
    type: string
    example: work
  isFavourite:
    type: boolean
    example: true
  photo:
    type: string
    nullable: true
    example: null
  userId:
    type: string
    example: 68754f82a385ae3a7ff9fc5b
  createdAt:
    type: string
    format: date-time
    example: '2025-07-16T16:04:11.390Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-07-16T16:04:11.390Z'
