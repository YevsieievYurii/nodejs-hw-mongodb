tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve all user contacts

parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      default: 1
    description: Page number for pagination
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      default: 10
    description: Number of contacts per page
  - in: query
    name: sortBy
    schema:
      type: string
      enum: [name, email, createdAt]
    description: The field to sort by
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
    description: Sorting direction
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter contacts by isFavourite

security:
  - bearerAuth: []

responses:
  '200':
    description: Contacts list retrieved
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                contacts:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                total:
                  type: integer
                  example: 43
  '401':
    $ref: '../../components/responses/401.yaml'
