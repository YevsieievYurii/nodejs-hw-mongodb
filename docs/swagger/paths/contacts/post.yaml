tags:
  - Contacts
summary: Create a contact
operationId: createContact
description: Add a new contact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            example: Jane Doe
          email:
            type: string
            format: email
            example: jane@example.com
          phoneNumber:
            type: string
            example: '+380987654321'
          contactType:
            type: string
            example: work
          isFavorite:
            type: boolean
            example: false
responses:
  '201':
    description: Contact created
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
