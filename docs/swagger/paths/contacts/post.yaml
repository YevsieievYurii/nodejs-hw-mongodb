tags:
  - Contacts
summary: Create a contact
operationId: createContact
description: Add a new contact
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            example: Jane Doe
          email:
            type: string
            format: email
            example: jane@example.com
          phoneNumber:
            type: string
            example: '+380987654321'
          contactType:
            type: string
            enum: [work, home, personal]
            example: work
          isFavourite:
            type: boolean
            example: false
          photo:
            type: string
            format: binary
            description: Contact photo file (optional)
responses:
  '201':
    description: Contact created
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
