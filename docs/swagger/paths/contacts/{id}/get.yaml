tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Retrieve a single contact by ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 60d21b4667d0d8992e610c85
responses:
  '200':
    description: Contact found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 60d21b4667d0d8992e610c85!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
